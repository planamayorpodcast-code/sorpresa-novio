<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Alex & Sofi ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f8eadf;
            color: #633d39;
            font-family: Georgia, serif;
            overflow-x: hidden;
        }

        .pantalla {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .contenido {
            width: 100%;
            max-width: 430px;
        }

        h1 {
            font-size: 32px;
            line-height: 1.2;
            font-weight: normal;
            font-style: italic;
            margin: 0 0 30px;
        }

        .subtitulo {
            font-size: 17px;
            margin-bottom: 25px;
        }

        .polaroid {
            background: white;
            padding: 12px 12px 45px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transform: rotate(-2deg);
            margin: 0 auto 35px;
            max-width: 360px;
        }

        .polaroid img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        .nombres {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .boton {
            display: inline-block;
            border: none;
            background: #ad4141;
            color: white;
            padding: 17px 45px;
            border-radius: 50px;
            font-family: Georgia, serif;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.18);
            transition: 0.3s;
        }

        .boton:hover {
            transform: scale(1.06);
        }

        #segunda {
            display: none;
            position: relative;
            overflow: hidden;
        }
.imagen-anillo {
    width: 100%;
    max-width: 430px;
    height: auto;
    display: block;
    margin: 0 auto;
    border-radius: 10px;
}
        .carta {
            background: rgba(255,255,255,0.75);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
            line-height: 1.8;
            font-size: 18px;
            margin-top: 25px;
        }

        .corazon {
            position: fixed;
            bottom: -50px;
            font-size: 25px;
            animation: subir 5s linear forwards;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes subir {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .firma {
            margin-top: 30px;
            font-style: italic;
            font-size: 20px;
        }

        .volver {
            margin-top: 30px;
            background: transparent;
            color: #8f4545;
            border: 1px solid #8f4545;
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-family: Georgia, serif;
        }

        @media (max-width: 500px) {

            h1 {
                font-size: 28px;
            }

            .polaroid img {
                height: 300px;
            }

            .carta {
                font-size: 17px;
            }
.contenido-anillo {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0;
}

.imagen-anillo {
    width: 100%;
    max-width: 500px;
    height: auto;
    display: block;
    cursor: pointer;
    animation: aparecerAnillo 1.5s ease;
}

.texto-tocar {
    margin-top: 15px;
    font-size: 18px;
    color: #633d39;
    animation: latido 1.5s infinite;
}

@keyframes aparecerAnillo {
    from {
        opacity: 0;
        transform: scale(0.85);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes latido {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.08);
    }
}
    </style>
</head>

<body>

    <!-- PRIMERA PANTALLA -->

    <section class="pantalla" id="inicio">

        <div class="contenido">

            <h1>
                Hay algo que quiero<br>
                decirte...
            </h1>

            <div class="subtitulo">
                Una pequeña sorpresa para ti ❤️
            </div>

            <div class="polaroid">

                <img src="inicio.png">

            </div>

            <div class="nombres">
                Alex & Sofi ❤️
            </div>

            <button class="boton" onclick="abrirSorpresa()">
                Descúbrelo ❤️
            </button>

        </div>

    </section>


   <!-- SEGUNDA PANTALLA -->
<section class="pantalla" id="segunda">

    <div class="contenido-anillo">

        <img 
            src="anillo.png" 
            class="imagen-anillo"
            onclick="mostrarTercera()"
        >

        <p class="texto-tocar">
            Toca la imagen ❤️
        </p>

    </div>

</section>
<!-- TERCERA PANTALLA -->
<section class="pantalla" id="tercera" style="display: none;">

    <div class="contenido-final">

        <img src="final.png" class="imagen-final">

    </div>

</section>

    <script>

        function abrirSorpresa() {

            document.getElementById("inicio").style.display = "none";

            document.getElementById("segunda").style.display = "flex";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

            crearCorazones();

        }

function mostrarTercera() {
    document.getElementById("segunda").style.display = "none";
    document.getElementById("tercera").style.display = "flex";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
        function volverInicio() {

            document.getElementById("segunda").style.display = "none";

            document.getElementById("inicio").style.display = "flex";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        function crearCorazones() {

            for (let i = 0; i < 25; i++) {

                setTimeout(function() {

                    const corazon = document.createElement("div");

                    corazon.className = "corazon";

                    corazon.innerHTML = "❤️";

                    corazon.style.left =
                        Math.random() * 100 + "vw";

                    corazon.style.animationDuration =
                        (3 + Math.random() * 4) + "s";

                    corazon.style.fontSize =
                        (18 + Math.random() * 25) + "px";

                    document.body.appendChild(corazon);

                    setTimeout(function() {

                        corazon.remove();

                    }, 7000);

                }, i * 150);

            }

        }

    </script>

</body>
</html>

</body>
</html>
