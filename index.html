<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una sorpresa para ti ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f7eadf;
            font-family: Georgia, serif;
            color: #6b4038;
        }

        .contenedor {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            padding: 40px 25px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 30px;
            font-weight: normal;
            font-style: italic;
            margin-bottom: 25px;
        }

        .foto {
            background: white;
            padding: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            transform: rotate(-2deg);
            margin-bottom: 35px;
        }

        .foto img {
            width: 100%;
            display: block;
        }

        .nombre {
            font-size: 18px;
            margin-bottom: 35px;
        }

        button {
            border: none;
            background: #a83d3d;
            color: white;
            padding: 18px 35px;
            border-radius: 50px;
            font-size: 18px;
            font-family: Georgia, serif;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: scale(1.05);
        }

        #mensaje {
            display: none;
            margin-top: 30px;
            font-size: 20px;
            line-height: 1.6;
        }

        .corazon {
            font-size: 35px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Hay algo que quiero decirte...</h1>

        <div class="foto">
            <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800&q=80">
        </div>

        <div class="nombre">
            Alex & Sofi 
        </div>

        <button onclick="mostrarMensaje()">
            Descúbrelo vida
        </button>

        <div id="mensaje">
            Gracias por llegar a mi vida,<br>
            por cada sonrisa<br>
            y por estar a mi lado. ❤️

            <div class="corazon">
                ❤️
            </div>
        </div>

    </div>

    <script>
        function mostrarMensaje() {
            document.getElementById("mensaje").style.display = "block";
        }
    </script>

</body>
</html>
